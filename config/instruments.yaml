# The basket: 25 NSE names across eight sectors.
#
# IMPORTANT: refresh start_price from the live market a day or two before the
# event. The prices below are placeholders so the system runs out of the box;
# they are not current quotes. `scripts/seed.py --prices prices.csv` will take a
# two-column CSV of symbol,price if you would rather not edit this file.
#
# Tuning guide:
#   spread_bps        10 large cap, 25 mid, 50 small. Wider spread punishes churn.
#   daily_vol_pct     expected one-day standard deviation. 1.2 quiet, 2.5 lively.
#   liquidity         rupees tradable in one slice before slippage starts.
#   band_pct          circuit limit measured from the day's reference price.
#   index_weight      relative weight in the CLUB 50 index.

