<!DOCTYPE html>
<html lang="en" data-theme="dark">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="theme-color" content="#0a0e0d">
  <title>Sign in - Trading Terminal</title>
  <link rel="stylesheet" href="/static/css/terminal.css">
  <link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'><rect width='32' height='32' rx='6' fill='%232dd4a7'/><path d='M7 21l5-6 4 3 5-8 4 5' stroke='%2304110d' stroke-width='2.5' fill='none' stroke-linecap='round' stroke-linejoin='round'/></svg>">
</head>
<body>
<div class="login-page">
  <div class="login-card">
    <div class="brand">
      <span class="mark">M</span>
      <span id="competitionName">Mock Market Championship</span>
    </div>
    <p class="muted" style="margin:6px 0 0">
      Sign in with the login and password on your team's card.
    </p>

    <div class="error-box" id="error" hidden></div>

    <form id="loginForm" autocomplete="on">
      <div class="field">
        <label for="login">Login</label>
        <input type="text" id="login" name="username" autocomplete="username"
               placeholder="abc123-1" autocapitalize="none" spellcheck="false" required>
      </div>
      <div class="field">
        <label for="password">Password</label>
        <input type="password" id="password" name="password" autocomplete="current-password" required>
      </div>
      <button type="submit" class="btn primary block" id="submit">Sign in</button>
    </form>

    <!-- The market clock is shown before sign-in on purpose: someone who cannot
         get in wants to know whether they are late, and this answers it without
         them having to ask a volunteer. -->
    <div class="login-status">
      <span>
        <span class="label">Market</span><br>
        <b id="marketState">Checking...</b>
        <span class="muted" id="marketDay"></span>
      </span>
      <span style="text-align:right">
        <span class="label">Time left</span><br>
        <b class="mono" id="countdown">--:--</b>
      </span>
    </div>

    <p class="dim" style="font-size:11.5px;margin:14px 0 0">
      Lost your card or forgotten the password? The help desk can issue a new one.
      Operators sign in at <a href="/console/login">the console</a>.
    </p>
  </div>
</div>

<script type="module">
import { api } from "/static/js/api.js";
import { duration, STATE_TEXT } from "/static/js/format.js";

const el = (id) => document.getElementById(id);
let endsAt = null;

try {
  const theme = localStorage.getItem("exchange.theme");
  if (theme) document.documentElement.setAttribute("data-theme", theme);
} catch { /* private browsing */ }

async function pollMarket() {
  try {
    const market = await api.get("/api/market");
    el("marketState").textContent = STATE_TEXT[market.state] || market.state;
    el("marketDay").textContent = market.day_no ? `- day ${market.day_no} of ${market.total_days}` : "";
    if (market.rules?.competition) el("competitionName").textContent = market.rules.competition;
    document.title = `Sign in - ${market.rules?.competition || "Trading Terminal"}`;
    endsAt = market.ends_at ? new Date(market.ends_at).getTime() : null;
  } catch {
    el("marketState").textContent = "Cannot reach the exchange";
  }
}

setInterval(() => {
  el("countdown").textContent = endsAt ? duration((endsAt - Date.now()) / 1000) : "--:--";
}, 250);

pollMarket();
setInterval(pollMarket, 10000);

el("loginForm").addEventListener("submit", async (event) => {
  event.preventDefault();
  const submit = el("submit");
  const error = el("error");
  error.hidden = true;
  submit.disabled = true;
  submit.textContent = "Signing in...";
  try {
    const data = await api.request("/api/auth/login", {
      method: "POST",
      body: { login: el("login").value.trim().toLowerCase(), password: el("password").value },
      retry: false,
    });
    api.setToken(data.access_token);
    window.location.href = "/";
  } catch (err) {
    error.textContent = err.message;
    error.hidden = false;
    submit.disabled = false;
    submit.textContent = "Sign in";
    el("password").value = "";
    el("password").focus();
  }
});
</script>
</body>
</html>
