# Fly.io. One always-on machine in Mumbai.
app = "mock-stock-terminal-66fa7e"
primary_region = "bom"

[build]
  dockerfile = "Dockerfile"

[env]
  EXCHANGE_HOST = "0.0.0.0"
  EXCHANGE_PORT = "8000"
  EXCHANGE_SECURE_COOKIES = "true"
  EXCHANGE_LOG_LEVEL = "INFO"
  # SQLite on a persistent volume. With exactly one process there is no
  # concurrency problem, money is stored as exact scaled integers, and
  # synchronous=FULL means a killed machine cannot lose committed trades.
  EXCHANGE_DATABASE_URL = "sqlite+aiosqlite:////data/exchange.db"
  EXCHANGE_SQLITE_SYNCHRONOUS = "FULL"

[[mounts]]
  source = "exchange_data"
  destination = "/data"

[http_service]
  internal_port = 8000
  force_https = true
  # Never stop the machine. The market clock runs between requests, and a
  # machine that slept when idle would freeze the market mid-session.
  auto_stop_machines = false
  auto_start_machines = true
  min_machines_running = 1

  [http_service.concurrency]
    type = "connections"
    hard_limit = 800
    soft_limit = 600

# Exactly one machine, always. Two would be two market engines.
[[vm]]
  size = "shared-cpu-1x"
  memory = "512mb"

[checks.health]
  type = "http"
  port = 8000
  path = "/healthz"
  interval = "30s"
  timeout = "5s"
  grace_period = "30s"
